name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loopwire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/loopwire_test
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/loopwire_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: Lint
        run: uvx ruff check app tests evals scripts
      - name: Unit tests (real Postgres, no network/LLM)
        run: uv run pytest
      - name: Migrations apply cleanly and match models
        run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "CREATE DATABASE loopwire_migrate"
          DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/loopwire_migrate uv run alembic upgrade head
          DATABASE_URL=postgresql+psycopg2://postgres:postgres@localhost:5432/loopwire_migrate uv run alembic check

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx next build
        env:
          AUTH_SECRET: ci-placeholder
          AUTH_GOOGLE_ID: ci-placeholder
          AUTH_GOOGLE_SECRET: ci-placeholder
