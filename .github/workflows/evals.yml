name: evals

# Real-LLM evals cost quota, so they run on demand and weekly, not per push.
# Exit code 1 when a regression gate fails (see backend/evals/run_all.py).
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated: extraction,summary,recall,ranking"
        default: "extraction,summary,recall,ranking"
  schedule:
    - cron: "0 3 * * 1"

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run python -m evals.run_all --only "${{ github.event.inputs.only || 'extraction,summary,recall,ranking' }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: |
            backend/evals/REPORT.md
            backend/evals/results/
